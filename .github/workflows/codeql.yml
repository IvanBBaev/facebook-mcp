name: CodeQL

# Static analysis (SAST) on push/PR plus a weekly cron, so advisories in
# unchanged code still surface. TypeScript is covered by the
# javascript-typescript CodeQL language; no build step is required.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 5 * * 1' # weekly, Monday 05:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
