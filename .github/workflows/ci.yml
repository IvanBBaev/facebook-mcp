name: CI

on:
  push:
    branches: [main]
  pull_request:

# No repo secrets are used anywhere in this workflow: unit tests run against a
# fetch-thrower fence and synthetic fixtures, never the live Graph API.
permissions:
  contents: read

# Every job has a `timeout-minutes` (R11, QA-04): the slowest job takes about
# 3 minutes, and a hung test or child process must fail the run long before
# GitHub's 6-hour default.
jobs:
  # `npm run check` includes the coverage gate (R11): c8 thresholds plus the
  # per-file ratchet (scripts/coverage-ratchet.mjs), on every Node of the matrix.
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  # Metadata drift gate (R01): the generated artifacts — server.json, the MCPB
  # manifest, the Claude plugin files, .env.example and the README tables — are
  # projections of one SSOT. Regenerating them here and diffing proves the
  # committed copies were not hand-edited or left behind. `npm run check`
  # already builds, and the generator reads the compiled package factories.
  metadata:
    name: metadata drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run metadata:check

  # Supply-chain gate. A real gate: no `continue-on-error`, no `|| true`.
  #
  # The flags are chosen, not copied:
  #   --omit=dev            audits only the tree that is actually installed on a
  #                         user's machine. This package ships three runtime
  #                         dependencies; a devDependency advisory is a
  #                         maintainer chore for Dependabot, not a reason to fail
  #                         a PR that never touched it.
  #   --audit-level=high    exit non-zero on high and critical only. `moderate`
  #                         over a transitive dev tree fires constantly for
  #                         things that are unreachable from this code, and a
  #                         gate that cries wolf is a gate people learn to skip.
  #                         Over a three-package runtime tree a genuine high is
  #                         rare and worth stopping the line for.
  #
  # This is a tripwire, not the primary control: the lockfile, Dependabot and
  # CodeQL do the day-to-day work. It runs on its own job so a registry outage
  # is legible as "audit failed", not as a mystery inside `check`.
  audit:
    name: audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # Windows leg (win32 path/line-ending safety) on the .nvmrc Node.
  windows:
    name: check (Windows, Node 22)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run check

  # Cold-start gate (doc 08, Phase 4 exit: `npx -y <pkg>` cold-starts on macOS +
  # Windows). Every other job runs the server from `build/`; this one runs it
  # the way Claude Desktop/Code do. scripts/cold-start.mjs packs this commit,
  # starts it with `npx -y <tarball>` from an empty directory and a fresh npm
  # cache, and requires initialize (serverInfo name/version = package metadata)
  # and a non-empty tools/list over stdio. A missing entry in
  # package.json#files, a runtime import of a devDependency or a bin shim that
  # exits silently fails here, on the PR, instead of after an irreversible
  # publish. No secret is involved: the child gets a visibly fake token, and a
  # preloaded fetch fence fails the run if startup reaches for the network.
  cold-start:
    name: cold start (npx, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run cold-start

  # Bundle gate. scripts/pack-mcpb.mjs runs exactly once in the life of a
  # release: in the `bundle` job of release.yml, on a v*.*.* tag, in parallel
  # with the irreversible npm publish. Nothing else executes it — it has no unit
  # tests and no other CI caller. A break in the packer, in the manifest's
  # server.entry_point, or in package.json#files (which decides whether the
  # entry point is in the publish surface at all) would therefore first surface
  # at release time, after npm has taken a version that can never be
  # republished. Packing here moves that failure onto the PR. The job only
  # builds a bundle in the runner workspace: it uploads nothing, attests
  # nothing and publishes nothing.
  bundle:
    name: mcpb bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run pack:mcpb
